# docker-compose.prod.yml — produkcija na strežniku (aapanel)
# Uporaba: docker compose -f docker-compose.prod.yml up -d
# Image se potegne z Docker Hub: iztokvozlic/kk-karlo:latest

services:
  app:
    image: iztokvozlic/kk-karlo:latest
    ports:
      - "8080:80"        # aapanel reverse proxy → port 8080
    environment:
      APP_NAME: "KK Karlo"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_LOCALE: sl
      APP_FALLBACK_LOCALE: en
      AVAILABLE_LANGUAGES: sl,en,de,it,hr
      AVAILABLE_COLOR_THEMES: zinc,amber,blue,emerald,orange
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-kk_karlo}
      DB_USERNAME: ${DB_USERNAME:-karlo}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: "KK Karlo"
      NOTIFICATION_ENABLE_PORTAL: "true"
      NOTIFICATION_ENABLE_EMAIL: "true"
      NOTIFICATION_ENABLE_SMS: ${NOTIFICATION_ENABLE_SMS:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kk_karlo}
      POSTGRES_USER: ${DB_USERNAME:-karlo}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-karlo} -d ${DB_DATABASE:-kk_karlo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  storage_uploads:
  storage_logs:
